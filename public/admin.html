<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ops · Transfer review</title>
<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e5e7eb;--teal:#0f766e;--red:#b91c1c;--amb:#b45309}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,Segoe UI,Inter,Roboto,sans-serif}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:16px;margin:0}.wrap{max-width:1000px;margin:0 auto;padding:16px}
input,button{font:inherit}input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:100%}
button{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer}
button.p{background:var(--teal);color:#fff;border-color:var(--teal)}button.d{background:#fff;color:var(--red);border-color:#fecaca}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button.on{background:var(--ink);color:#fff}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600}
.review{background:#fef3c7;color:var(--amb)}.processing{background:#e0f2fe;color:#0369a1}.completed{background:#dcfce7;color:#15803d}.rejected,.cancelled{background:#fee2e2;color:var(--red)}
.mut{color:var(--mut);font-size:12px}.amt{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.login{max-width:340px;margin:12vh auto;display:grid;gap:10px}
</style></head><body>
<div id="app"></div>
<script>
/* >>> FILL IN (same values as in index.html) <<< */
var SB_URL = "https://fmydakznmewscxzarymu.supabase.co";        // https://xxxx.supabase.co
var SB_ANON = "sb_publishable_eIY2eQhtn9Vaey0wN5t41g_d3u0xlqX";       // anon public key

var $ = function(s){return document.querySelector(s)}, app = $('#app');
var session = null, tab = 'review', rows = [], timer = null;
try { session = JSON.parse(localStorage.getItem('n26_admin_sess')||'null'); } catch(e){}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function eur(n){return Number(n).toLocaleString('de-DE',{style:'currency',currency:'EUR'})}
function ago(d){var s=Math.max(0,(Date.now()-new Date(d))/1000);return s<60?Math.floor(s)+'s':s<3600?Math.floor(s/60)+' min':s<86400?Math.floor(s/3600)+' h':Math.floor(s/86400)+' d'}
var FLAGS={amount_500:'Amount ≥ 500 €',sum24_1500:'24h total ≥ 1 500 €',velocity:'4+ transfers in 1 h',unknown_recipient:'Unknown recipient ≥ 100 €',first_payee_200:'First payee ≥ 200 €'};

function hdr(extra){var h={apikey:SB_ANON,'Content-Type':'application/json'};if(session)h.Authorization='Bearer '+session.access_token;return h}
function login(){
  app.innerHTML='<form class="login card" id="f"><h1>Ops · Transfer review</h1><input id="em" type="email" placeholder="Admin e-mail" required><input id="pw" type="password" placeholder="Password" required><button class="p">Sign in</button><div class="mut" id="err"></div></form>';
  $('#f').onsubmit=function(e){e.preventDefault();
    fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_ANON,'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value,password:$('#pw').value})})
    .then(function(r){return r.json()}).then(function(j){
      if(!j.access_token){$('#err').textContent=j.error_description||j.msg||'Login failed';return}
      session={access_token:j.access_token,refresh_token:j.refresh_token,email:$('#em').value,exp:Date.now()+j.expires_in*1000-60000};
      try{localStorage.setItem('n26_admin_sess',JSON.stringify(session))}catch(e){} start();
    }).catch(function(){$('#err').textContent='Network error'});
  };
}
function refresh(){
  if(!session||!session.refresh_token) return Promise.resolve();
  if(Date.now()<session.exp) return Promise.resolve();
  return fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_ANON,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})})
   .then(function(r){return r.json()}).then(function(j){
     if(!j.access_token){session=null;localStorage.removeItem('n26_admin_sess');return}
     session.access_token=j.access_token;session.refresh_token=j.refresh_token;session.exp=Date.now()+j.expires_in*1000-60000;
     try{localStorage.setItem('n26_admin_sess',JSON.stringify(session))}catch(e){}
   });
}
function load(){
  return refresh().then(function(){
    if(!session) return login();
    return fetch(SB_URL+'/rest/v1/transfers?select=*&order=created_at.desc&limit=200',{headers:hdr()}).then(function(r){
      if(r.status===401){session=null;login();return null}return r.json()}).then(function(j){
      if(!j) return; if(!Array.isArray(j)){app.innerHTML='<div class="wrap card">'+esc(JSON.stringify(j))+'</div>';return}
      rows=j; draw();
    });
  });
}
function eff(r){return (r.status==='processing'&&r.expected_at&&new Date(r.expected_at)<=new Date())?'completed':r.status}
function draw(){
  var cnt={review:0,processing:0,completed:0,rejected:0};
  rows.forEach(function(r){var s=eff(r);if(s==='cancelled')s='rejected';cnt[s]=(cnt[s]||0)+1});
  var list=rows.filter(function(r){var s=eff(r);if(s==='cancelled')s='rejected';return tab==='all'||s===tab});
  app.innerHTML='<header><h1>Ops · Transfer review</h1><div class="row"><span class="mut">'+esc(session.email)+'</span><button id="out">Sign out</button></div></header><div class="wrap">'+
   '<div class="tabs">'+['review','processing','completed','rejected','all'].map(function(k){return '<button data-t="'+k+'" class="'+(tab===k?'on':'')+'">'+k[0].toUpperCase()+k.slice(1)+(cnt[k]!=null?' · '+cnt[k]:'')+'</button>'}).join('')+'</div>'+
   (list.length?list.map(card).join(''):'<div class="card mut">Nothing here.</div>')+'</div>';
  $('#out').onclick=function(){session=null;localStorage.removeItem('n26_admin_sess');clearInterval(timer);login()};
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(b){b.onclick=function(){tab=b.dataset.t;draw()}});
  Array.prototype.forEach.call(document.querySelectorAll('[data-ok]'),function(b){b.onclick=function(){decide(b.dataset.ok,true)}});
  Array.prototype.forEach.call(document.querySelectorAll('[data-no]'),function(b){b.onclick=function(){var r=prompt('Reason for rejection (shown to the customer):','Declined by compliance');if(r!==null)decide(b.dataset.no,false,r)}});
}
function card(r){
  var s=eff(r);
  return '<div class="card"><div class="row"><div><span class="pill '+s+'">'+s+'</span> <span class="mut">'+ago(r.created_at)+' ago · '+esc(r.id.slice(-8))+'</span></div><div class="amt">'+eur(r.amount)+'</div></div>'+
   '<div style="margin-top:8px"><b>'+esc(r.from_name||r.from_email)+'</b> <span class="mut">'+esc(r.from_iban)+'</span><br>→ <b>'+esc(r.to_name||'—')+'</b> <span class="mut">'+esc(r.to_iban)+(r.to_email?' · tester':' · external')+'</span></div>'+
   (r.note?'<div class="mut" style="margin-top:4px">“'+esc(r.note)+'”</div>':'')+
   (r.review_flag?'<div class="mut" style="margin-top:4px">Rule: '+esc(FLAGS[r.review_flag]||r.review_flag)+'</div>':'')+
   (r.reason?'<div class="mut" style="margin-top:4px">Reason: '+esc(r.reason)+'</div>':'')+
   (r.status==='review'?'<div class="row" style="margin-top:10px;justify-content:flex-end"><button class="d" data-no="'+esc(r.id)+'">Reject</button><button class="p" data-ok="'+esc(r.id)+'">Approve</button></div>':'')+
   (r.status==='processing'&&s==='processing'?'<div class="row" style="margin-top:10px;justify-content:flex-end"><button class="d" data-no="'+esc(r.id)+'">Block</button></div>':'')+
  '</div>';
}
function decide(id,ok,reason){
  refresh().then(function(){return fetch(SB_URL+'/rest/v1/rpc/n26_admin_decide',{method:'POST',headers:hdr(),body:JSON.stringify({p_id:id,p_approve:ok,p_reason:reason||null})})})
   .then(function(r){return r.json()}).then(function(j){if(j&&j.ok===false)alert(j.error);load()});
}
function start(){load();clearInterval(timer);timer=setInterval(load,6000)}
if(!SB_URL||!SB_ANON){app.innerHTML='<div class="wrap card">Set <b>SB_URL</b> and <b>SB_ANON</b> at the top of the script.</div>'}
else if(session){start()}else{login()}
</script></body></html>
